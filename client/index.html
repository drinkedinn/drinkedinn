<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Force the app onto the www host BEFORE anything loads. The bare domain
         307-redirects /api to www, and browsers drop the Authorization header
         across that host change → every authed call 401s → reload loop. Pin to www. -->
    <script>
      (function () {
        if (location.hostname === 'drinkedinn.com') {
          location.replace('https://www.drinkedinn.com' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DrinkedInn – Where Professionals Actually Unwind</title>
    <meta name="description" content="The social network for drink lovers. Share your pours, connect with whisky nerds, craft beer geeks, and wine professionals. No synergy. Just good drinks." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.drinkedinn.com/" />
    <link rel="canonical" href="https://www.drinkedinn.com/" />
    <meta property="og:title" content="DrinkedInn – Where Professionals Actually Unwind" />
    <meta property="og:description" content="The social network for drink lovers. Share pours, connect with whisky nerds, craft beer geeks & wine pros." />
    <meta property="og:image" content="https://www.drinkedinn.com/og-image.png" />
    <meta property="og:site_name" content="DrinkedInn" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DrinkedInn – Where Professionals Actually Unwind" />
    <meta name="twitter:description" content="Share your pours. Connect with drink lovers. No synergy required." />
    <meta name="twitter:image" content="https://www.drinkedinn.com/og-image.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#0a66c2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrinkedInn" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #f0f2f5; color: #1a1a1a; font-family: 'Inter', sans-serif; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f0f2f5; }
      ::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
