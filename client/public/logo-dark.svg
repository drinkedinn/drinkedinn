<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <linearGradient id="liquidD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="badgeD" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glowD">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowD">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00000060"/>
    </filter>
    <clipPath id="glassClipD">
      <polygon points="22,14 58,14 66,96 14,96"/>
    </clipPath>
  </defs>

  <g transform="translate(10,5)" filter="url(#shadowD)">
    <ellipse cx="40" cy="100" rx="30" ry="6" fill="#00000030"/>
    <polygon points="22,14 58,14 66,96 14,96"
      fill="rgba(255,255,255,0.06)"
      stroke="rgba(200,220,255,0.5)" stroke-width="2"/>
    <rect x="0" y="46" width="80" height="52"
      fill="url(#liquidD)" opacity="0.95"
      clip-path="url(#glassClipD)"/>
    <ellipse cx="40" cy="46" rx="18" ry="3.5"
      fill="#FCD34D" opacity="0.6"
      clip-path="url(#glassClipD)"/>
    <circle cx="32" cy="70" r="2.5" fill="rgba(255,255,255,0.6)"/>
    <circle cx="46" cy="62" r="1.8" fill="rgba(255,255,255,0.5)"/>
    <circle cx="38" cy="80" r="1.5" fill="rgba(255,255,255,0.45)"/>
    <polygon points="24,16 30,16 22,88 16,88" fill="rgba(255,255,255,0.22)"/>
    <ellipse cx="40" cy="14" rx="18" ry="4"
      fill="rgba(200,220,255,0.12)"
      stroke="rgba(200,220,255,0.5)" stroke-width="1.5"/>
    <rect x="22" y="96" width="36" height="7" rx="3.5"
      fill="rgba(180,205,240,0.25)"
      stroke="rgba(200,220,255,0.45)" stroke-width="1.2"/>
    <ellipse cx="40" cy="96" rx="26" ry="5"
      fill="rgba(180,205,240,0.15)"
      stroke="rgba(200,220,255,0.35)" stroke-width="1"/>
    <rect x="30" y="34" width="14" height="14" rx="2.5"
      fill="rgba(210,235,255,0.35)"
      stroke="rgba(255,255,255,0.55)" stroke-width="1"
      transform="rotate(12,37,41)"/>
  </g>

  <text x="102" y="75"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="52" font-weight="800" letter-spacing="-2"
    fill="#ffffff">Drinked</text>

  <rect x="330" y="30" width="80" height="52" rx="10"
    fill="url(#badgeD)"
    filter="url(#shadowD)"/>
  <rect x="332" y="32" width="76" height="24" rx="8"
    fill="rgba(255,255,255,0.18)"/>
  <text x="370" y="67"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="38" font-weight="900" letter-spacing="-1"
    text-anchor="middle"
    fill="#ffffff">Inn</text>
  <circle cx="406" cy="35" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="406" cy="35" r="2.5" fill="rgba(255,255,255,0.5)"/>
</svg>
