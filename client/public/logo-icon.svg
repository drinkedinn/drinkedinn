<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="iconBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2"/>
      <stop offset="100%" stop-color="#1d8fe8"/>
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(10,102,194,0.35)"/>
    </filter>
  </defs>

  <!-- Blue rounded square background -->
  <rect width="80" height="80" rx="18" fill="url(#iconBadge)" filter="url(#iconShadow)"/>

  <!-- Shine overlay -->
  <rect x="0" y="0" width="80" height="36" rx="18"
    fill="rgba(255,255,255,0.15)"/>
  <rect x="0" y="18" width="80" height="18"
    fill="rgba(255,255,255,0.15)"/>

  <!-- "DI" monogram -->
  <text x="40" y="50"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="30" font-weight="900" letter-spacing="-1"
    text-anchor="middle"
    fill="#ffffff">DI</text>

  <!-- Beer emoji accent -->
  <text x="58" y="28"
    font-size="16"
    text-anchor="middle">🍺</text>
</svg>
