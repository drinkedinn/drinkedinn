<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="liq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <clipPath id="gc">
      <polygon points="35,18 85,18 95,98 25,98"/>
    </clipPath>
    <filter id="gs">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000060"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>

  <!-- Subtle amber glow behind glass -->
  <ellipse cx="60" cy="72" rx="38" ry="30" fill="#D97706" opacity="0.12"/>

  <!-- Glass body -->
  <g filter="url(#gs)">
    <polygon points="35,18 85,18 95,98 25,98"
      fill="rgba(200,225,255,0.07)"
      stroke="rgba(180,210,255,0.45)" stroke-width="1.8"/>

    <!-- Amber liquid -->
    <rect x="0" y="54" width="120" height="46"
      fill="url(#liq)" opacity="0.93"
      clip-path="url(#gc)"/>

    <!-- Liquid surface -->
    <ellipse cx="60" cy="54" rx="25" ry="4"
      fill="#FCD34D" opacity="0.5"
      clip-path="url(#gc)"/>

    <!-- Bubbles -->
    <circle cx="48" cy="74" r="3"   fill="rgba(255,255,255,0.55)"/>
    <circle cx="66" cy="65" r="2.2" fill="rgba(255,255,255,0.45)"/>
    <circle cx="56" cy="82" r="1.8" fill="rgba(255,255,255,0.4)"/>

    <!-- Ice cube -->
    <rect x="46" y="38" width="18" height="18" rx="3"
      fill="rgba(210,235,255,0.38)"
      stroke="rgba(255,255,255,0.55)" stroke-width="1.2"
      transform="rotate(14,55,47)"/>

    <!-- Left shine -->
    <polygon points="37,20 44,20 32,90 26,90"
      fill="rgba(255,255,255,0.16)"/>

    <!-- Top rim -->
    <ellipse cx="60" cy="18" rx="25" ry="5"
      fill="rgba(200,220,255,0.12)"
      stroke="rgba(180,210,255,0.55)" stroke-width="1.5"/>

    <!-- Base -->
    <rect x="36" y="98" width="48" height="8" rx="4"
      fill="rgba(180,205,240,0.2)"
      stroke="rgba(180,210,255,0.4)" stroke-width="1.2"/>
    <ellipse cx="60" cy="98" rx="34" ry="6"
      fill="rgba(180,205,240,0.12)"
      stroke="rgba(180,210,255,0.3)" stroke-width="1"/>
  </g>

  <!-- "DI" monogram badge (bottom-right) -->
  <rect x="74" y="76" width="38" height="28" rx="7"
    fill="url(#badgeGrad)"
    opacity="0.95"/>
  <text x="93" y="96"
    font-family="'Helvetica Neue',Arial,sans-serif"
    font-size="16" font-weight="900" letter-spacing="-0.5"
    text-anchor="middle"
    fill="#ffffff">DI</text>
</svg>
