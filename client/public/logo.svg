<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120">
  <defs>
    <!-- Amber gradient for glass liquid -->
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- Glass body gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(180,210,255,0.5)"/>
      <stop offset="35%"  stop-color="rgba(220,235,255,0.15)"/>
      <stop offset="70%"  stop-color="rgba(200,220,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(180,210,255,0.5)"/>
    </linearGradient>
    <!-- Badge gradient -->
    <linearGradient id="badge" x1="0%" y1="0%" x2="135%" y2="135%">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Drop shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000025"/>
    </filter>
    <!-- Clip glass contents -->
    <clipPath id="glassClip">
      <polygon points="22,14 58,14 66,96 14,96"/>
    </clipPath>
  </defs>

  <!-- ── Glass icon (80×110 canvas, offset 10,5) ── -->
  <g transform="translate(10,5)" filter="url(#shadow)">
    <!-- Glass shadow base -->
    <ellipse cx="40" cy="100" rx="30" ry="6" fill="#00000015"/>

    <!-- Glass body -->
    <polygon points="22,14 58,14 66,96 14,96"
      fill="rgba(180,210,255,0.10)"
      stroke="rgba(150,190,240,0.6)" stroke-width="2"/>

    <!-- Amber liquid fill -->
    <rect x="0" y="46" width="80" height="52"
      fill="url(#liquid)" opacity="0.92"
      clip-path="url(#glassClip)"/>

    <!-- Liquid surface glint -->
    <ellipse cx="40" cy="46" rx="18" ry="3.5"
      fill="#FCD34D" opacity="0.55"
      clip-path="url(#glassClip)"/>

    <!-- Bubble 1 -->
    <circle cx="32" cy="70" r="2.5" fill="rgba(255,255,255,0.55)"/>
    <!-- Bubble 2 -->
    <circle cx="46" cy="62" r="1.8" fill="rgba(255,255,255,0.45)"/>
    <!-- Bubble 3 -->
    <circle cx="38" cy="80" r="1.5" fill="rgba(255,255,255,0.4)"/>

    <!-- Glass shine (left edge) -->
    <polygon points="24,16 30,16 22,88 16,88"
      fill="rgba(255,255,255,0.18)"/>
    <!-- Glass shine (inner right) -->
    <polygon points="52,16 56,16 62,80 58,80"
      fill="rgba(255,255,255,0.08)"/>

    <!-- Top rim -->
    <ellipse cx="40" cy="14" rx="18" ry="4"
      fill="rgba(180,210,255,0.15)"
      stroke="rgba(150,190,240,0.6)" stroke-width="1.5"/>

    <!-- Base plate -->
    <rect x="22" y="96" width="36" height="7" rx="3.5"
      fill="rgba(150,185,230,0.3)"
      stroke="rgba(150,190,240,0.5)" stroke-width="1.2"/>
    <ellipse cx="40" cy="96" rx="26" ry="5"
      fill="rgba(150,185,230,0.2)"
      stroke="rgba(150,190,240,0.4)" stroke-width="1"/>

    <!-- Ice cube -->
    <rect x="30" y="34" width="14" height="14" rx="2.5"
      fill="rgba(210,235,255,0.4)"
      stroke="rgba(255,255,255,0.6)" stroke-width="1"
      transform="rotate(12,37,41)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Drinked" -->
  <text x="102" y="75"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="52" font-weight="800" letter-spacing="-2"
    fill="#1a1a2e">Drinked</text>

  <!-- "Inn" badge -->
  <rect x="330" y="30" width="80" height="52" rx="10"
    fill="url(#badge)"
    filter="url(#shadow)"/>

  <!-- Badge shine -->
  <rect x="332" y="32" width="76" height="24" rx="8"
    fill="rgba(255,255,255,0.15)"/>

  <!-- "Inn" text -->
  <text x="370" y="67"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="38" font-weight="900" letter-spacing="-1"
    text-anchor="middle"
    fill="#ffffff">Inn</text>

  <!-- Whisky drop accent on badge -->
  <circle cx="406" cy="35" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="406" cy="35" r="2.5" fill="rgba(255,255,255,0.5)"/>
</svg>
