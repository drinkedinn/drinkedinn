<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="innBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2"/>
      <stop offset="100%" stop-color="#1d8fe8"/>
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(10,102,194,0.3)"/>
    </filter>
  </defs>

  <!-- "Drinked" wordmark -->
  <text x="0" y="56"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="52" font-weight="900" letter-spacing="-2"
    fill="#1a1a2e">Drinked</text>

  <!-- "Inn 🍺" badge -->
  <rect x="218" y="10" width="98" height="56" rx="8"
    fill="url(#innBadge)"
    filter="url(#badgeShadow)"/>

  <!-- Badge shine -->
  <rect x="220" y="12" width="94" height="26" rx="6"
    fill="rgba(255,255,255,0.15)"/>

  <!-- "Inn" text -->
  <text x="267" y="52"
    font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
    font-size="32" font-weight="900" letter-spacing="-1"
    text-anchor="middle"
    fill="#ffffff">Inn 🍺</text>
</svg>
